name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    env:
      # Warnings fail the build, as they do before a commit locally.
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release

  # Windows is a trial (2026-11-08): it builds odeion.exe to try, warnings allowed, and
  # its tests don't fail the run yet.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: odeion-windows
          path: target/release/odeion.exe
      - run: cargo test
        continue-on-error: true
