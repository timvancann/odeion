name: Release

# Push a tag like v0.2.0 (the version in Cargo.toml) and this builds Odeion.app for Apple
# silicon and Intel in one, and publishes it as a GitHub release. With the signing
# secrets set (docs/releasing.md) the app is signed and notarized, so it opens like any
# other; without them it is only ad-hoc signed and macOS asks once before opening it.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      RUSTFLAGS: -D warnings
      # The oldest macOS Odeion runs on, as Info.plist's LSMinimumSystemVersion says.
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    # Actions pinned to commits: this job holds the signing secrets, so nothing in it may
    # change under it. The build cache is only read, and only main writes it (ci.yml's
    # release-cache job), never a pull request.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: The tag matches Cargo.toml
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME but Cargo.toml says $cargo_version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release
          save-if: false
      - run: brew install resvg

      - run: cargo test

      - name: Build for Apple silicon and Intel
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output target/odeion-universal \
            target/aarch64-apple-darwin/release/odeion \
            target/x86_64-apple-darwin/release/odeion

      - name: Bundle Odeion.app
        run: ODEION_BINARY=target/odeion-universal ODEION_VERSION="$VERSION" tools/bundle.sh

      - name: Sign and notarize
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE" ]; then
            echo "::warning::No signing secrets: the release is ad-hoc signed only. See docs/releasing.md."
            echo "SIGNED=no" >> "$GITHUB_ENV"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          # Apple's Developer ID intermediate, so the chain is whole on a fresh runner.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          # Ours first, then the ones already there (one word each, so unquoted).
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" target/Odeion.app
          codesign --verify --strict --verbose=2 target/Odeion.app

          ditto -c -k --keepParent target/Odeion.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --wait \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          xcrun stapler staple target/Odeion.app
          echo "SIGNED=yes" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="Odeion-$VERSION.zip"
          ditto -c -k --keepParent target/Odeion.app "$zip"
          # The same zip under a name that never changes, for the README's download link:
          # releases/latest/download/Odeion-macOS.zip is always the newest.
          cp "$zip" Odeion-macOS.zip
          if [ "$SIGNED" = yes ]; then
            mac="**macOS:** download Odeion-macOS.zip, unzip it and drag Odeion into Applications."
          else
            mac="**macOS:** download Odeion-macOS.zip, unzip it and drag Odeion into Applications. This build isn't notarized by Apple, so macOS blocks it the first time: open it once, then go to System Settings, Privacy & Security, and click Open Anyway. Or run \`xattr -dr com.apple.quarantine /Applications/Odeion.app\` in Terminal."
          fi
          windows="**Windows (trial):** download Odeion-Windows.zip, unzip it and run odeion.exe. Windows warns about an unknown publisher the first time: click More info, then Run anyway."
          # What changed: CHANGELOG.md's section headed with this version ("## 0.3.0 ..."),
          # up to the next heading, without its leading blank lines.
          changes="$(awk -v v="$VERSION" '/^## / { if (found) exit; if ($2 == v) { found = 1; next } } found' CHANGELOG.md | sed '/./,$!d')"
          if [ -z "$changes" ]; then
            echo "::warning::CHANGELOG.md has no section for $VERSION: the release notes only say how to install."
            notes="$mac"$'\n\n'"$windows"
          else
            notes="$changes"$'\n\n'"$mac"$'\n\n'"$windows"
          fi
          gh release create "$GITHUB_REF_NAME" "$zip" Odeion-macOS.zip --title "Odeion $VERSION" \
            --notes "$notes" --generate-notes

  # The Windows build (a trial), added to the release the job above made. No signing
  # secrets here; the build cache is read-only, written by ci.yml's windows job on main.
  windows:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows
          save-if: false
      - run: cargo build --release
      - name: Add Odeion-Windows.zip to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart("v")
          Compress-Archive -Path target/release/odeion.exe -DestinationPath "Odeion-$version-Windows.zip"
          Copy-Item "Odeion-$version-Windows.zip" Odeion-Windows.zip
          gh release upload "$env:GITHUB_REF_NAME" "Odeion-$version-Windows.zip" Odeion-Windows.zip

  # Signs both zips for Odeion's own updater (update.rs installs nothing its public key
  # doesn't verify) and adds the signatures to the release. The trusted comment names the
  # file and version, so an old release can't be passed off as a new one. The only job
  # with MINISIGN_KEY; without it the release can still be downloaded by hand.
  sign:
    needs: [release, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Sign the zips
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        run: |
          if [ -z "$MINISIGN_KEY" ]; then
            echo "::warning::No MINISIGN_KEY secret: Odeion can't install this release by itself. See docs/releasing.md."
            exit 0
          fi
          sudo apt-get update -q && sudo apt-get install -y -q minisign
          version="${GITHUB_REF_NAME#v}"
          key="$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_KEY" > "$key"
          gh release download "$GITHUB_REF_NAME" -p Odeion-macOS.zip -p Odeion-Windows.zip
          for zip in Odeion-macOS.zip Odeion-Windows.zip; do
            minisign -S -s "$key" -m "$zip" -t "$zip $version"
          done
          rm "$key"
          gh release upload "$GITHUB_REF_NAME" Odeion-macOS.zip.minisig Odeion-Windows.zip.minisig
