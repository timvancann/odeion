[package]
name = "riff"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = "=0.2.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lofty = "0.25.4"
rodio = { version = "0.22.2", features = ["symphonia-aiff"] }
rustfft = "6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
souvlaki = "0.8"
symphonia = { version = "=0.5.5", features = ["mp3", "flac", "pcm", "vorbis", "ogg", "wav", "aiff", "isomp4", "aac"] }
