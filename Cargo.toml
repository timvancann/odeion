[package]
name = "odeion"
version = "0.3.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.9" }
# runtime_shaders: the Metal toolchain doesn't run here, see AGENTS.md.
gpui_platform ={ package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit", "runtime_shaders"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lofty = "0.25.4"
raw-window-handle = "0.6"
rodio = { version = "0.22.2", features = ["symphonia-aiff"] }
rustfft = "6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signalsmith-stretch = "0.1"
souvlaki = "0.8"
symphonia = { version = "=0.5.5", features = ["mp3", "flac", "pcm", "vorbis", "ogg", "wav", "aiff", "isomp4", "aac", "alac"] }
ureq = "3.5.1"

[build-dependencies]
embed-resource = "3"
